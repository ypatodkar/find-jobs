name: Scrape and deploy

on:
  schedule:
    # Twice a day: late morning and end of the working day on the US west coast, which
    # is when boards actually post. A full pass makes ~600 outbound requests to
    # Ashby/Greenhouse/Lever, so there is no point spending them overnight.
    #
    # Cron here is UTC and GitHub has no timezone support, so these are fixed UTC and
    # shift by an hour against the wall clock at each DST changeover:
    #   18:00 UTC -> 11am PDT (summer) / 10am PST (winter)
    #   00:00 UTC ->  5pm PDT (summer) /  4pm PST (winter)
    # Nudge to "0 19,1 * * *" if you would rather the winter times be the exact ones.
    #
    # Shared runners also delay scheduled jobs by 5-20 minutes, so treat these as
    # approximate either way.
    - cron: "0 18,0 * * *"
  push:
    branches: [main]
  workflow_dispatch: # lets you force a scrape from the Actions tab

# Hosting is Cloudflare Pages, not GitHub Pages: Pages will not publish a private
# repo on a free plan, and this repo is private. Nothing here writes to the repo.
permissions:
  contents: read

# A scheduled run and a manual run must not deploy over each other. Queue rather than
# cancel, so an in-flight scrape isn't thrown away half-done.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Scrape all boards
        run: node scrape.js

      - name: Build static site
        run: node build.js

      # The D1 sync is gone rather than ported. It existed so a click could be joined
      # back to a job title, but the /click handler already writes company, title and
      # city for any job it has not seen, so the table fills itself with exactly the
      # jobs someone actually opened. Pushing all ~12,700 scraped rows every run was
      # writing 38,000 rows a day — including index writes — to decorate a few hundred
      # clicks, which is what kept exhausting D1's free tier.
      #
      # sync-jobs.js is still in the repo and still emits valid Postgres; run it by
      # hand against RDS if the full catalogue is ever wanted in the database. Nothing
      # in the site or the API needs it.

      - name: Publish to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          # --delete so a file removed from the build leaves the bucket too. The short
          # max-age is what lets a scrape land within minutes; CloudFront still serves
          # from cache until the invalidation below clears it.
          aws s3 sync dist/ s3://find-jobs-site-075521919080/ --delete \
            --cache-control "public, max-age=300, must-revalidate" \
            --exclude "*.woff2" --only-show-errors
          # Fonts are content-addressed by name and never change under the same URL.
          aws s3 sync dist/ s3://find-jobs-site-075521919080/ \
            --exclude "*" --include "*.woff2" \
            --cache-control "public, max-age=31536000, immutable" --only-show-errors

      - name: Invalidate CloudFront
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        # A wildcard invalidation counts as one path against the 1,000-a-month free
        # allowance, so this is well inside it at two scheduled runs a day.
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1ST056VLPSM75 --paths "/*" \
            --query 'Invalidation.[Id,Status]' --output text
