name: Scrape and deploy

on:
  schedule:
    # Twice a day: late morning and end of the working day on the US west coast, which
    # is when boards actually post. A full pass makes ~600 outbound requests to
    # Ashby/Greenhouse/Lever, so there is no point spending them overnight.
    #
    # Cron here is UTC and GitHub has no timezone support, so these are fixed UTC and
    # shift by an hour against the wall clock at each DST changeover:
    #   18:00 UTC -> 11am PDT (summer) / 10am PST (winter)
    #   00:00 UTC ->  5pm PDT (summer) /  4pm PST (winter)
    # Nudge to "0 19,1 * * *" if you would rather the winter times be the exact ones.
    #
    # Shared runners also delay scheduled jobs by 5-20 minutes, so treat these as
    # approximate either way.
    - cron: "0 18,0 * * *"
  push:
    branches: [main]
  workflow_dispatch: # lets you force a scrape from the Actions tab

# Hosting is Cloudflare Pages, not GitHub Pages: Pages will not publish a private
# repo on a free plan, and this repo is private. Nothing here writes to the repo.
permissions:
  contents: read

# A scheduled run and a manual run must not deploy over each other. Queue rather than
# cancel, so an in-flight scrape isn't thrown away half-done.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Scrape all boards
        run: node scrape.js

      - name: Build static site
        run: node build.js

      # Optional: only runs once you add a CLOUDFLARE_API_TOKEN secret. Keeps the D1
      # jobs table in step with the scrape so click counts resolve to real roles.
      # Never touches clicks or first_seen.
      - name: Sync job metadata to D1
        # Scheduled and manual runs only. Every sync writes one row per live job —
        # ~12,500 — against a free-tier allowance of 100,000 written rows per day, so
        # six runs in a day exhausts it and D1 then refuses writes until midnight UTC.
        # A push usually changes the site rather than the jobs, and the next scheduled
        # run re-syncs from scratch anyway, so pushes deploy without touching D1.
        # Trigger the workflow manually if a push does need the table updated.
        if: env.CF_TOKEN != '' && github.event_name != 'push'
        # Analytics must never hold the site hostage: if D1 is down or the token is
        # wrong, the deploy below still ships. The next run re-syncs from scratch.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Required. Without it wrangler calls /memberships to discover the account,
          # which a scoped token cannot read — it fails with "Authentication error".
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node sync-jobs.js
          npx --yes wrangler d1 execute vcjobs --remote --file=sync.sql -y

      # Direct upload of dist/, the same thing `wrangler pages deploy` does locally.
      # No Cloudflare Git integration needed, so the repo can stay private.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=find-jobs --branch=main
