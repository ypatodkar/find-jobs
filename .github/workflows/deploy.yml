name: Scrape and deploy

on:
  schedule:
    # Twice a day: late morning and end of the working day on the US west coast, which
    # is when boards actually post. A full pass makes ~600 outbound requests to
    # Ashby/Greenhouse/Lever, so there is no point spending them overnight.
    #
    # Cron here is UTC and GitHub has no timezone support, so these are fixed UTC and
    # shift by an hour against the wall clock at each DST changeover:
    #   18:00 UTC -> 11am PDT (summer) / 10am PST (winter)
    #   00:00 UTC ->  5pm PDT (summer) /  4pm PST (winter)
    # Nudge to "0 19,1 * * *" if you would rather the winter times be the exact ones.
    #
    # Shared runners also delay scheduled jobs by 5-20 minutes, so treat these as
    # approximate either way.
    - cron: "0 18,0 * * *"
  push:
    branches: [main]
  workflow_dispatch: # lets you force a scrape from the Actions tab

# Hosting is Cloudflare Pages, not GitHub Pages: Pages will not publish a private
# repo on a free plan, and this repo is private. Nothing here writes to the repo.
permissions:
  contents: read

# A scheduled run and a manual run must not deploy over each other. Queue rather than
# cancel, so an in-flight scrape isn't thrown away half-done.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobs_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: jobs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Whether the server-side catalogue is live yet. It is deployed in two halves —
      # the Lambda and its tables are provisioned by hand (aws/CATALOGUE.md), and this
      # variable is what says that happened. Reported rather than enforced: the static
      # site does not need the catalogue, so a missing variable must not stop a scrape
      # from publishing. Failing here would take the whole site down to protect a
      # feature that is not serving traffic.
      - name: Catalogue configured?
        id: catalogue
        env:
          CATALOGUE_LAMBDA_FUNCTION: ${{ vars.CATALOGUE_LAMBDA_FUNCTION }}
        run: |
          if [ -n "$CATALOGUE_LAMBDA_FUNCTION" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CATALOGUE_LAMBDA_FUNCTION is unset — skipping the API deploy and catalogue import. See aws/CATALOGUE.md."
          fi

      # Ahead of the scrape, not after it. These cover the keep/skip rules and the
      # payload builders the scrape depends on, so a rule broken by the last commit
      # should stop the run rather than get published — and failing before spending
      # ~600 outbound requests is strictly better than failing after.
      - name: Test
        env:
          TEST_DATABASE_URL: postgresql://jobs_test:test_only@127.0.0.1:5432/jobs_test
        run: |
          npm ci --prefix aws/lambda --omit=dev
          npm ci
          node --test test/*.test.js
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Package and update the API
        if: steps.catalogue.outputs.configured == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          CATALOGUE_LAMBDA_FUNCTION: ${{ vars.CATALOGUE_LAMBDA_FUNCTION }}
        run: |
          node aws/package-lambda.js
          aws lambda update-function-code --function-name "$CATALOGUE_LAMBDA_FUNCTION" --zip-file fileb://aws/function.zip --query LastUpdateStatus
          aws lambda wait function-updated --function-name "$CATALOGUE_LAMBDA_FUNCTION"

      - name: Scrape all boards
        run: node bin/scrape.js

      - name: Build static site
        run: node bin/build.js

      - name: Import the catalogue before publishing
        if: steps.catalogue.outputs.configured == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          CATALOGUE_BUCKET: find-jobs-site-075521919080
          CATALOGUE_LAMBDA_FUNCTION: ${{ vars.CATALOGUE_LAMBDA_FUNCTION }}
        run: |
          node bin/catalogue-export.js
          node aws/import-catalogue.js

      - name: Publish to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          # --delete so a file removed from the build leaves the bucket too. The short
          # max-age is what lets a scrape land within minutes; CloudFront still serves
          # from cache until the invalidation below clears it.
          aws s3 sync dist/ s3://find-jobs-site-075521919080/ --delete \
            --cache-control "public, max-age=300, must-revalidate" \
            --exclude "*.woff2" --exclude "catalogue/*" --only-show-errors
          # Fonts are content-addressed by name and never change under the same URL.
          aws s3 sync dist/ s3://find-jobs-site-075521919080/ \
            --exclude "*" --include "*.woff2" \
            --cache-control "public, max-age=31536000, immutable" --only-show-errors

      # Both hosts, deliberately, until DNS moves. jobs.ypatodkar.com still resolves to
      # Cloudflare Pages, so dropping this step would freeze what visitors actually see
      # while the scraper kept running — a stale job list with no outward sign anything
      # was wrong. S3 above keeps the AWS copy current so the cutover stays a DNS change
      # and nothing else. Delete this step once DNS points at CloudFront.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=find-jobs --branch=main

      - name: Invalidate CloudFront
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        # A wildcard invalidation counts as one path against the 1,000-a-month free
        # allowance, so this is well inside it at two scheduled runs a day.
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1ST056VLPSM75 --paths "/*" \
            --query 'Invalidation.[Id,Status]' --output text
