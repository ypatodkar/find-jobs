<head>
  <meta charset="UTF-8" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>" />
  <meta name="description" content="37 US venture firms, grouped by how central AI is to their thesis, each with a live count of open engineering roles across its portfolio." />
  <link rel="canonical" href="https://jobs.ypatodkar.com/firms.html" />

  <!-- Link previews on LinkedIn, Slack, iMessage, X. Absolute URLs are required:
       relative ones are not resolved by any of the crawlers. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Find Jobs" />
  <meta property="og:title" content="Browse by investor — Find Jobs" />
  <meta property="og:description" content="37 US venture firms, grouped by how central AI is to their thesis, each with a live count of open engineering roles across its portfolio." />
  <meta property="og:url" content="https://jobs.ypatodkar.com/firms.html" />
  <meta property="og:image" content="https://jobs.ypatodkar.com/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Find Jobs — engineering roles at VC-backed companies" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Browse by investor — Find Jobs" />
  <meta name="twitter:description" content="37 US venture firms, grouped by how central AI is to their thesis, each with a live count of open engineering roles across its portfolio." />
  <meta name="twitter:image" content="https://jobs.ypatodkar.com/og.png" />

  <!-- Colours the browser's own chrome — the address bar on mobile — to match the page
       it sits above, rather than leaving a white strip over a dark site. -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111014" media="(prefers-color-scheme: dark)" />


  <!-- The OS preference is handled in CSS and needs no script. This applies only a
       deliberate override, and has to run here, before the first paint: any later and
       a visitor who chose light on a dark laptop would watch the page change under
       them. Inline and blocking for the same reason. src/lib/theme.js owns the rest. -->
  <script>
    try {
      var t = localStorage.getItem("vc-directory-theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to investors</a>
  <main class="page" id="main-content"></main>
  <script type="module" src="/src/firms.jsx"></script>
</body>
</html>
