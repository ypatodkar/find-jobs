<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- The host serves this page at whatever unknown path was asked for, /a/b/c as much as
       /x. With this, every relative URL on it (the built scripts and styles, the header's
       links) resolves from the site's root rather than from that path. -->
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Find Jobs</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>" />

  <meta name="theme-color" content="#fdfcf9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f0d0b" media="(prefers-color-scheme: dark)" />

  <!-- The same pre-paint theme as the other pages (see the note in firms.html): it has
       to run before the first paint, or a dark-mode visitor sees the page flash white. -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("vc-directory-theme"); } catch (e) {}
      if (t !== "dark" && t !== "light") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <a id="skip-link" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 focus:rounded-md focus:border focus:bg-background focus:px-3 focus:py-2 focus:text-sm focus:font-medium focus:text-foreground focus:shadow-md" href="#content">Skip to content</a>
  <!-- Under <base href="/"> a bare "#content" would mean "/#content", the home
       page; point the skip link at this document instead. -->
  <script>document.getElementById("skip-link").href = location.pathname + location.search + "#content";</script>
  <main id="main-content"></main>
  <script type="module" src="/src/notfound.jsx"></script>
</body>
</html>
