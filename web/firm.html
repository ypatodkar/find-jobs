<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Investor roles — Find Jobs</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>" />
  <meta name="description" content="Open engineering roles across one investor's portfolio, pulled from each company's own job board and updated twice daily." />
  <link rel="canonical" href="https://jobs.ypatodkar.com/firm.html" />

  <!-- Link previews on LinkedIn, Slack, iMessage, X. Absolute URLs are required:
       relative ones are not resolved by any of the crawlers. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Find Jobs" />
  <meta property="og:title" content="Investor roles — Find Jobs" />
  <meta property="og:description" content="Open engineering roles across one investor's portfolio, pulled from each company's own job board and updated twice daily." />
  <meta property="og:url" content="https://jobs.ypatodkar.com/firm.html" />
  <meta property="og:image" content="https://jobs.ypatodkar.com/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Find Jobs — engineering roles at VC-backed companies" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Investor roles — Find Jobs" />
  <meta name="twitter:description" content="Open engineering roles across one investor's portfolio, pulled from each company's own job board and updated twice daily." />
  <meta name="twitter:image" content="https://jobs.ypatodkar.com/og.png" />

  <!-- Colours the browser's own chrome — the address bar on mobile — to match the page
       it sits above, rather than leaving a white strip over a dark site. -->
  <meta name="theme-color" content="#fdfcf9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f0d0b" media="(prefers-color-scheme: dark)" />


  <!-- Puts the theme in effect on <html data-theme>: a stored override, else the OS.
       It has to run here, before the first paint: any later and a visitor on a dark
       laptop would watch the page change under them. Inline and blocking for the same
       reason. src/lib/theme.js owns the rest. -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("vc-directory-theme"); } catch (e) {}
      if (t !== "dark" && t !== "light") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <a class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-50 focus:rounded-full focus:bg-primary focus:px-3 focus:py-1.5 focus:text-sm focus:font-medium focus:text-primary-foreground focus:shadow-md focus:outline-none focus-visible:ring-3 focus-visible:ring-ring/50" href="#firm-name">Skip to job listings</a>
  <main class="flex min-h-dvh flex-col" id="main-content"></main>

</body>
</html>
